const T = (rows) => '<div class="tblwrap"><table class="data">' + rows.map((r,i)=>'<tr>'+r.map(c=>i===0?'<th>'+c+'</th>':'<td>'+c+'</td>').join('')+'</tr>').join('') + '</table></div>';

const DIAG = [
 {id:"d1",topic:"Basics",q:"In this course, what do <b>query</b>, <b>corpus</b> and <b>relevance</b> mean?",model:"Query = the user's expression of their information need. Corpus = the repository of retrievable items (a collection of text documents). Relevance = satisfaction of the user's information need.",key:"All three defined; relevance tied to satisfying the information need.",sheet:"Query = expression of info need · Corpus = collection of docs · Relevance = satisfies the info need"},
 {id:"d2",topic:"Basics",q:"Give one <b>query-document</b> piece of evidence and one <b>document-only</b> piece of evidence a search engine can use to predict relevance.",model:"Query-document: the query terms appear often / all appear / appear close together / appear in the title, URL or anchor text. Document-only (same for every query): many in-links, fresh, not spam, normal length, appropriate reading level.",key:"One valid example of each, correctly classified.",sheet:"Query-doc evidence: terms frequent, close together, in title/anchor · Doc-only: in-links, freshness, not spam"},
 {id:"d3",topic:"Controlled vocab",q:"Compare a <b>controlled vocabulary</b> and <b>free-text indexing</b> on: cost of assigning index terms, ambiguity, and level of detail.",model:"Controlled vocabulary: high cost, unambiguous, can't represent arbitrary detail. Free-text: low cost, can be ambiguous, any level of detail.",key:"All three rows for both sides.",sheet:"CV: high cost · unambiguous · limited detail | Free-text: low cost · ambiguous · any detail"},
 {id:"d4",topic:"Controlled vocab",q:"Name one thing a controlled vocabulary can do that free-text indexing can't.",model:"Tag a document with a concept even if the word never appears in the text; or let users browse a hierarchy of concepts without typing a query.",key:"Concept doesn't need to appear in text, or browsing via relationships.",sheet:"CV win: concept doesn't have to appear in the text; browse hierarchy without a query"},
 {id:"d5",topic:"Indexing",q:"Inverted lists: jack = [3, 8, 12, 20, 31], jill = [8, 15, 20, 40]. What do <b>jack AND jill</b> and <b>jack OR jill</b> return?",model:"AND = {8, 20}. OR = {3, 8, 12, 15, 20, 31, 40}.",key:"Both result sets exactly right.",sheet:"AND = docids in both lists · OR = every docid once, still sorted"},
 {id:"d6",topic:"Indexing",q:"Why are inverted lists sorted by docid? Explain how it helps for <b>AND</b> and for <b>OR</b>.",model:"So two lists can be merged in one pass with two pointers. AND: if the docids match, keep it; otherwise advance the pointer with the lower docid; stop when one list runs out. OR: add the lower docid each step (a match once) and advance it; the result stays sorted. Without sorting you'd compare every pair.",key:"One pass / compare lowest docids; AND explained (advance lower, stop early); OR explained (add lower each step).",sheet:"Sorted docids → one pass, two pointers. AND: match=keep, else advance lower, stop when a list ends. OR: add the lower each step until both end"},
 {id:"d7",topic:"Indexing",q:"df: apple = 5,000, ipad = 40, case = 900. What's the most efficient order to process <b>apple AND ipad AND case</b>, and why does the index store df?",model:"(ipad AND case) AND apple: merge the shortest lists first so the intermediate result stays small. df tells the engine how long each list is so it can pick that order.",key:"Shortest lists first; df = list length used for ordering.",sheet:"Merge order: shortest df first. df = # docs with term = list length"},
 {id:"d8",topic:"Indexing",q:"What does the index need (beyond docids and tf) to support: (a) a phrase query \"information science\", (b) information OW/2 science, (c) phototherapy[title], (d) light AND therap*?",model:"(a) and (b) word positions in each doc (a positional index). (c) a separate index per field, or term.field entries like phototherapy.title. (d) no index change: a prefix→terms dictionary, and the query expands to the full terms joined with OR.",key:"Positions for a and b; fields for c; prefix dictionary + OR for d.",sheet:"Phrase/proximity → positions · field → per-field index or term.field · wildcard → prefix dictionary, expand with OR"},
 {id:"d9",topic:"Text processing",q:"What is the core motivation for <b>down-casing</b>? Give one case where it backfires.",model:"Case rarely changes meaning and users type in lowercase, so \"Information\" should match \"information\" (normalizing case). It backfires when case carries meaning: SMART vs smart, Bush vs bush, US vs us.",key:"Normalization / match regardless of case; one valid risk.",sheet:"Down-casing: same word regardless of case (users type lowercase). Risk: SMART/smart, US/us"},
 {id:"d10",topic:"Text processing",q:"What is the core motivation for <b>stemming</b>? Does it help recall or precision, and give one false positive.",model:"Relevant documents use different forms of the same word (repair, repairs, repairing), so conflating them to one stem lets the query match them all. It improves recall; precision is not clear-cut. False positive: university/universe, policy/police, organization/organ.",key:"Matches word variants; recall; one valid false positive.",sheet:"Stemming: match word variants → ↑recall (precision not clear-cut). False +: university/universe"},
 {id:"d11",topic:"Text processing",q:"What is the core motivation for <b>removing stopwords</b>? When does it backfire?",model:"Stopwords are frequent in every document, so they don't help separate relevant from non-relevant docs; removing them also shrinks the index and speeds up queries. It backfires on queries made of stopwords: \"to be or not to be\", \"the who\".",key:"Don't distinguish relevant docs (and/or index size, speed); valid failure example.",sheet:"Stopwords: in every doc → don't discriminate; smaller index. Risk: \"to be or not to be\""},
 {id:"d12",topic:"Text processing",q:"Why would you index whether a word appears in the <b>TITLE</b> or the <b>BODY</b> of a document?",model:"So users can restrict a query to a part of the document, and so title matches can be weighted higher: a term in the title is usually central to what the document is about.",key:"Field-restricted queries and/or title = stronger evidence of aboutness.",sheet:"Title vs body: allows field-restricted queries; title term = central topic → weight higher"},
 {id:"d13",topic:"Text processing",q:"After stemming, does the index have more or fewer distinct terms? What happens to the inverted lists?",model:"Fewer distinct terms (variants merge into one stem), but some inverted lists get longer because the merged variants' docids now share one list.",key:"Fewer terms; some lists longer.",sheet:"Stemming → fewer index terms, some lists longer"},
 {id:"d14",topic:"Text statistics",q:"Zipf's law (f = k ÷ r). The most frequent term occurs 12,000 times. Estimate how often the rank-4 term occurs, and how often the top 4 terms occur in total.",model:"Rank 4: 12,000 ÷ 4 = 3,000. Top 4 total: 12,000 + 6,000 + 4,000 + 3,000 = 25,000.",key:"3,000 and 25,000.",sheet:"Zipf: count = top ÷ rank; \"any of the top n\" → add them"},
 {id:"d15",topic:"Text statistics",q:"A collection's vocabulary has 2,000,000 distinct terms. Using Zipf, about how many terms appear <b>exactly twice</b>? (Fraction occurring n times = 1 ÷ (n × (n+1)).)",model:"1 ÷ (2 × 3) = 1/6, then 1/6 × 2,000,000 ≈ 333,333 terms.",key:"Uses 1/6 AND multiplies by vocabulary size: ≈333,333.",sheet:"Seen exactly n times = 1 ÷ (n(n+1)) → a FRACTION, × vocab size for a count"},
 {id:"d16",topic:"Text statistics",q:"Heaps' law: you add the same 500 documents to a 1,000-doc collection and to a 1,000,000-doc collection. Which gains more new vocabulary terms, and why?",model:"The 1,000-doc collection. Vocabulary growth slows as a collection gets bigger: the large collection has already seen most of the words in those documents.",key:"Smaller collection; growth slows with size.",sheet:"Heaps: new terms slow down as the collection grows but never stop"},
 {id:"d17",topic:"Text statistics",q:"1,000 documents: 50 contain both w1 and w2, 100 contain w1, 200 contain w2. Compute the mutual information (log base 10) and say what it means. MI = log[ P(both) ÷ (P(w1) × P(w2)) ].",model:"P(both) = 0.05, P(w1) = 0.10, P(w2) = 0.20. 0.05 ÷ 0.02 = 2.5, log(2.5) ≈ 0.40. Above 0, so the words co-occur more than chance: they're related.",key:"≈0.40 (or ln ≈ 0.92 if stated); positive = related.",sheet:"MI = log(BOTH ÷ (W1 × W2)), shares of docs. >0 related, 0 independent"},
 {id:"d18",topic:"Boolean",q:"Ranked Boolean. Doc A: cat 3, dog 7, fish 0. Doc B: cat 2, dog 2, fish 5. Score both for <b>(cat AND dog) OR fish</b>. Which ranks first?",model:"A: min(3, 7) = 3, then 3 + 0 = 3. B: min(2, 2) = 2, then 2 + 5 = 7. B ranks first.",key:"A = 3, B = 7, B first.",sheet:"Ranked Boolean: AND = smallest count, OR = add; parentheses first. One term = just its tf"},
 {id:"d19",topic:"Precision & recall",q:"Relevant = {2, 4, 6, 8, 10}. Retrieved = {2, 4, 7}. Compute precision and recall.",model:"Overlap = {2, 4}. Precision = 2 ÷ 3 ≈ 67%. Recall = 2 ÷ 5 = 40%.",key:"P ≈ 67%, R = 40%.",sheet:"P = got-good ÷ got · R = got-good ÷ all-good"},
 {id:"d20",topic:"Precision & recall",q:"A patent examiner checks whether an invention already exists. Someone else wants one good pizza place nearby. Which cares more about precision and which about recall? Why?",model:"Patent examiner → recall: missing one existing patent is costly, so they'll sift through junk. Pizza → precision: they only need a few good results at the top and will give up if the top is junk.",key:"Correct metric for each with cost-of-miss vs cost-of-junk reasoning.",sheet:"Recall = cost of missing is high (patent, legal, PhD novelty). Precision = only need a few good ones at top"},
 {id:"d21",topic:"Vector space",q:"Binary representation. Query: <b>red apple pie</b>. D1: \"apple pie with apple sauce\". D2: \"red apple\". Give each doc's inner product and cosine. Which ranks first under cosine?",model:"Inner product: D1 = 2 (apple, pie), D2 = 2 (red, apple). Cosine: D1 = 2 ÷ (√3 × √4) ≈ 0.58; D2 = 2 ÷ (√3 × √2) ≈ 0.82. D2 ranks first (fewer distinct words).",key:"IP 2 and 2; cosine ≈0.58 and ≈0.82; D2 first. Distinct words: D1 = 4, D2 = 2.",sheet:"Cosine = IP ÷ (√Q × √D), Q/D = # distinct words. Same IP → fewer distinct words wins"},
 {id:"d22",topic:"Vector space",q:"Same query and documents as the last question, but with a <b>term-frequency</b> representation. What is each doc's inner product?",model:"D1: apple 1×2 + pie 1×1 = 3. D2: red 1×1 + apple 1×1 = 2.",key:"D1 = 3, D2 = 2 (apple counted twice in D1).",sheet:"TF inner product: multiply query count × doc count for each word, add (repeats count)"},
 {id:"d23",topic:"Vector space",q:"N = 1,000 docs. \"the\" appears in all 1,000; \"lemur\" appears in 10. Give each IDF (log base 10). If \"lemur\" appears 4 times in a doc, what is its TF-IDF? Why multiply TF by IDF instead of adding?",model:"IDF(the) = log(1000/1000) = 0. IDF(lemur) = log(1000/10) = 2. TF-IDF = 4 × 2 = 8. Multiplying means a word in every document (IDF = 0) gets weight 0 no matter how often it appears.",key:"0, 2, 8; IDF 0 wipes out the weight.",sheet:"IDF = log(N ÷ df), word in every doc → 0. TF-IDF = TF × IDF (multiply so IDF 0 kills it)"},
 {id:"d24",topic:"Query likelihood",q:"Query likelihood, no smoothing. Query: <b>red apple</b>. D1 has 20 words: red 2, apple 4. D2 has 10 words: red 1, apple 0. Score both.",model:"D1 = (2/20) × (4/20) = 0.1 × 0.2 = 0.02. D2 = (1/10) × (0/10) = 0, because apple is missing.",key:"0.02 and 0.",sheet:"QL = share × share × … (share = count ÷ doc length). Any missing word → 0"},
 {id:"d25",topic:"Query likelihood",q:"Linear interpolation with λ = 0.5. For D2 above (red 1, apple 0, 10 words), P(red | collection) = 0.02 and P(apple | collection) = 0.01. What is D2's smoothed score? Name two benefits of smoothing.",model:"red: 0.5 × 0.1 + 0.5 × 0.02 = 0.06. apple: 0.5 × 0 + 0.5 × 0.01 = 0.005. Score = 0.06 × 0.005 = 0.0003. Benefits: no zero scores for a missing term; IDF-like weighting (rarer collection words count more).",key:"0.0003 (or the two blends shown); both benefits.",sheet:"Smoothed: blend = λ(doc share) + (1−λ)(collection share), multiply blends. Benefits: no zeros + IDF-like"},
 {id:"d26",topic:"Model comparison",q:"Query: otter. Dx and Dy both contain \"otter\" 3 times. Dx: 30 total words, 20 distinct. Dy: 60 total words, 15 distinct. Which wins under (a) ranked Boolean, (b) binary cosine, (c) QL with no smoothing?",model:"(a) Tie: both score tf = 3. (b) Dy: fewer distinct words (√15 < √20). (c) Dx: 3/30 = 0.1 beats 3/60 = 0.05 (fewer total words).",key:"Tie, Dy, Dx, with the length reason for b and c.",sheet:"Same tf: Boolean & IP tie · cosine → fewer DISTINCT words wins · QL → fewer TOTAL words wins"},
 {id:"d27",topic:"Model comparison",q:"(a) Why does unsmoothed query likelihood behave like Boolean AND? (b) Which kind of document does the plain inner product favor, and why?",model:"(a) Scores are multiplied, so one missing query term makes the score 0, like AND requiring every term. (b) Long documents: they're more likely to contain the query terms, and the inner product ignores length.",key:"Missing term → 0; long docs favored.",sheet:"Unsmoothed QL ≈ AND (missing → 0). Inner product favors long docs; cosine normalizes"}
];

const EXAMS = {
 examA:{title:"Practice Exam A", questions:[
  {id:"a1",title:"Indexes and retrieval",pts:10,q:"Inverted lists: dog = [2, 9, 14, 30] and cat = [9, 10, 30, 41, 52].",parts:[
   {id:"a1a",pts:6,q:"Walk through processing <b>dog AND cat</b> step by step. What is the result, and why can you stop before reaching the end of the cat list?",model:"2 vs 9 → advance dog. 9 = 9 → keep 9, advance both. 14 vs 10 → advance cat. 14 vs 30 → advance dog. 30 = 30 → keep 30, advance both. Dog list is done → stop. Result {9, 30}. You can stop because nothing left in cat can match an empty dog list.",key:"Result {9, 30}; advance the lower docid; stop when one list ends."},
   {id:"a1b",pts:4,q:"Why is OR usually more expensive than AND?",model:"OR has to walk both lists all the way to the end and produces a bigger result; AND can stop as soon as one list runs out.",key:"Walk both lists fully / larger output vs. AND's early stop."}]},
  {id:"a2",title:"Text processing in free-text indexing",pts:20,q:"For each decision, give the core motivation and one situation where it hurts.",parts:[
   {id:"a2a",pts:5,q:"(a) Down-casing",model:"Treat words the same regardless of case; users type lowercase. Hurts: US vs us, SMART vs smart.",key:"Normalization + valid risk."},
   {id:"a2b",pts:5,q:"(b) Stemming",model:"Match different forms of the same word (repair/repairing) → better recall. Hurts precision with false positives like university/universe.",key:"Word variants/recall + valid risk."},
   {id:"a2c",pts:5,q:"(c) Removing stopwords",model:"They appear in every document so they don't distinguish relevant docs; smaller index, faster queries. Hurts: \"to be or not to be\", \"the who\".",key:"Don't discriminate (or size/speed) + valid risk."},
   {id:"a2d",pts:5,q:"(d) Distinguishing TITLE from BODY",model:"Lets users restrict queries to the title and lets the engine weight title matches higher, since the title states the main topic. Hurts: bigger index (about double the terms).",key:"Field restriction/weighting + cost."}]},
  {id:"a3",title:"Precision vs. recall",pts:10,q:"A Boolean query retrieves 20 documents; 18 of them are relevant. The collection contains 200 relevant documents in total.",parts:[
   {id:"a3a",pts:4,q:"(a) Compute precision and recall.",model:"Precision = 18 ÷ 20 = 90%. Recall = 18 ÷ 200 = 9%.",key:"90% and 9%."},
   {id:"a3b",pts:3,q:"(b) A lawyer doing legal discovery: satisfied? Justify with precision/recall.",model:"No. Discovery needs recall: missing relevant documents is costly, and 9% recall leaves 182 relevant documents unfound.",key:"No; recall."},

// ---------- Claude grading ----------
const STYLE = "The student understands math best as plain-word fill-in recipes with real numbers (e.g. 'cosine = IP ÷ (√Q × √D) = 2 ÷ (√3 × √4) = 0.58'); never use Σ or ∏ notation. Her professor accepts short, correct answers: never penalize brevity, wording or minor rounding, only missing or wrong ideas. Address her as 'you'.";
function diagPrompt(item, ans){
  return "Grade a student's answer to a practice question for INLS 509 (Information Retrieval) midterm.\n"+STYLE+
  "\n\nQuestion: "+strip(item.q)+"\nModel answer: "+item.model+"\nWhat a full-credit answer needs: "+item.key+"\nStudent answer: "+ans+
  '\n\nReply with only JSON: {"verdict":"got_it"|"partial"|"missed","feedback":"at most 2 short sentences: what was right or what is missing/wrong, with the corrected recipe if a calculation is off"}';
}
function examPrompt(exam, parts){
  return "Grade a student's practice exam for INLS 509 (Information Retrieval). "+STYLE+
  "\nAward points per part (integers or halves, 0 to max). Give partial credit for correct reasoning with a small arithmetic slip.\n\nParts:\n"+
  parts.map(p=>"### "+p.id+" (max "+p.pts+" pts)\nQuestion: "+p.full+"\nModel answer: "+p.model+"\nFull credit needs: "+p.key+"\nStudent answer: "+(p.ans||"(blank)")).join("\n\n")+
  '\n\nReply with only a JSON array, one object per part in the same order: [{"id":"a1a","score":5,"feedback":"one or two short sentences"}]';
}
function strip(h){ const d=document.createElement("div"); d.innerHTML=h; d.querySelectorAll("table").forEach(t=>{t.replaceWith(" ["+[...t.rows].map(r=>[...r.cells].map(c=>c.textContent).join(" | ")).join(" ; ")+"] ");}); return d.textContent.replace(/\s+/g," ").trim(); }
function errCopy(e){ const c=e&&e.code; if(c==="not_granted"||c==="sampling_disabled") return "Claude grading isn't available here. Use the model answer and mark yourself."; if(c==="rate_limited") return "Too many grading requests at once. Wait a minute, then try again."; return "Grading didn't finish. Try again, or use the model answer and mark yourself."; }

function diagCard(item,i){

  if (r.feedback) paintFb(); if (r.shown) paintModel();

}

      parts.forEach(p=>{ if(!grades[p.id]) grades[p.id]={score:p.ans?0:0,feedback:p.ans?"Not graded; compare with the model answer.":"Left blank."}; });
      s.grades=grades; persist(key); render(); window.scrollTo({top:0});
    }catch(e){ st.textContent=errCopy(e); btn.disabled=false; }
  });
}
function strip2(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent.slice(0,60); }
function scoreCard(key){
  const ex=EXAMS[key], g=state[key].grades; let tot=0; const rows=ex.questions.map((q,i)=>{ const sc=q.parts.reduce((a,p)=>a+(g[p.id]?.score||0),0); tot+=sc; return "<div class='topicrow'><span>"+(i+1)+". "+q.title+"</span><span class='progress'>"+sc+" / "+q.pts+"</span></div>"; }).join("");
  const c=el("section",{class:"q summary"}); c.innerHTML="<div class='qhead'><span class='qnum'>Your score</span><span class='chip'>graded by Claude</span></div><div class='score'>"+tot+" / 100</div>"+rows+"<p class='note'>Feedback and model answers are under each part below. Anything you lost points on is a candidate for your notes sheet.</p>";
  return c;
}

function render(){
  if(timerId){clearInterval(timerId);timerId=null;}
  const main=document.getElementById("main"); main.innerHTML="";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
  if(view==="diag") renderDiag(main); else if(view==="sheet") renderSheet(main); else renderExam(main,view);
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ document.querySelectorAll("#main textarea").forEach(ta=>ta.dispatchEvent(new Event("change"))); view=t.dataset.view; try{localStorage.setItem(LS+"-view",view);}catch(e){} render(); window.scrollTo({top:0}); }));
try{ const v=localStorage.getItem(LS+"-view"); if(v&&["diag","sheet","examA","examB"].includes(v)) view=v; }catch(e){}
render();

// ---------- Capabilities ----------
(async()=>{
  try{ sample = await window.claude?.use("sample"); }catch(e){ sample=null; }
  try{
    db = await window.claude?.use("db");
    if(db){ let changed=false;
      for(const k of Object.keys(state)){ try{ const snap=await db.doc("attempts/"+k).get(); if(snap.exists){ const d=snap.data(); const local=state[k]; const lt=local.updatedAt||""; if(!lt || (d.updatedAt||"")>lt){ state[k]=Object.assign({answers:{},results:{},grades:null,elapsed:0},JSON.parse(JSON.stringify(d))); changed=true; } } }catch(e){} }
      if(changed && !document.activeElement?.matches("textarea")) render();
    }
  }catch(e){ db=null; }
})();
</script>
